name: Exp

on:
  workflow_dispatch:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    uses: Layr-Labs/labinius-fast-challenge/.github/workflows/benchmark.yml@master
    with:
      solution_repository: ${{ inputs.solution_repository || github.repository }}
      solution_ref: ${{ inputs.solution_ref || github.sha }}
