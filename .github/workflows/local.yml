name: Local bench

# Development rig: runs the challenge's own protected setup/benchmark scripts
# unmodified on a GitHub-hosted x86-64 runner. Official numbers come from
# `yukon submit` on the protected Xeon 8488C runner group; this is for A/B only.
on:
  workflow_dispatch:
    inputs:
      solution_repository:
        required: false
        type: string
      solution_ref:
        required: false
        type: string
      runs:
        required: false
        type: string
        default: "1"

permissions:
  contents: read
  actions: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Layr-Labs/labinius-fast-challenge
          ref: master
          path: .trusted-src
          submodules: recursive
          persist-credentials: false

      - name: Checkout untrusted solution input
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ inputs.solution_repository || github.repository }}
          ref: ${{ inputs.solution_ref || github.sha }}
          path: .untrusted-src
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-13 bubblewrap python3 openssl libssl-dev pkg-config curl ca-certificates git
          if [ ! -x /opt/cargo/bin/rustc ]; then
            curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/rustup.sh
            sudo env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh \
              -y --profile minimal --default-toolchain stable --no-modify-path
            rm -f /tmp/rustup.sh
          fi
          # gcc-13 does not know this runner's Zen 4 CPU, so `-march=native` leaves
          # AVX-512 off and the challenge's C sources fail to compile.
          if ! grep -q LABINIUS_DEV_SHIM /usr/bin/gcc-13 2>/dev/null; then
            sudo mv /usr/bin/gcc-13 /usr/bin/gcc-13.real
            printf '%s\n' '#!/bin/sh' '# LABINIUS_DEV_SHIM' \
              'exec /usr/bin/gcc-13.real -mavx512f -mavx512bw -mavx512vl -mavx512dq -mavx512cd -mavx512vbmi -mavx512vbmi2 -mavx512vnni -mavx512bf16 "$@"' \
              | sudo tee /usr/bin/gcc-13 >/dev/null
            sudo chmod 755 /usr/bin/gcc-13
          fi
          # The challenge's sandbox (bubblewrap) needs unprivileged user namespaces,
          # which the runner image restricts.
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w user.max_user_namespaces=15000 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w vm.max_map_count=1048576 || true
          /opt/cargo/bin/rustc --version
          /usr/bin/gcc-13 --version | head -1
          command -v bwrap

      - name: Probe AVX-512 execution
        shell: bash
        run: |
          set -euo pipefail
          awk -F: '/^model name/ {print $2; exit}' /proc/cpuinfo
          nproc
          grep -o -m1 -E 'avx512f|avx512bw|avx512vbmi|gfni' /proc/cpuinfo | sort -u | tr '\n' ' '
          echo
          free -g | head -2
          df -T "$RUNNER_TEMP" | tail -1
          cat > /tmp/avx512probe.c <<'PROBE'
          #include <immintrin.h>
          #include <stdio.h>
          int main(void) {
            __m512i a = _mm512_set1_epi32(7);
            __m512i b = _mm512_add_epi32(a, a);
            int out[16];
            _mm512_storeu_si512(out, b);
            printf("avx512-ok %d\n", out[0]);
            return 0;
          }
          PROBE
          gcc -mavx512f -O2 -o /tmp/avx512probe /tmp/avx512probe.c
          /tmp/avx512probe
          # Rust's `target-cpu=native` detection is flaky on this runner pool: some
          # instances leave AVX-512 off even though /proc/cpuinfo reports it, which
          # breaks the challenge's inline asm. Force the feature set the official
          # Xeon 8488C runner would have enabled.
          if ! grep -q LABINIUS_DEV_SHIM /opt/cargo/bin/rustc 2>/dev/null; then
            real=$(ls -d /opt/rustup/toolchains/*/bin/rustc | head -1)
            sudo mv /opt/cargo/bin/rustc /opt/cargo/bin/rustc.proxy
            printf '%s\n' '#!/bin/sh' '# LABINIUS_DEV_SHIM' \
              "exec $real -C target-cpu=native -C target-feature=+avx512f,+avx512bw,+avx512vl,+avx512dq,+avx512cd,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512bf16,+avx512bitalg,+avx512vpopcntdq,+gfni \"\$@\"" \
              | sudo tee /opt/cargo/bin/rustc >/dev/null
            sudo chmod 755 /opt/cargo/bin/rustc
          fi
          /opt/cargo/bin/rustc --print cfg -C target-cpu=native | grep -c avx512f

      - name: Setup
        shell: bash
        env:
          TRUSTED_CHECKOUT: ${{ github.workspace }}/.trusted-src
          UNTRUSTED_CHECKOUT: ${{ github.workspace }}/.untrusted-src
        run: bash "$GITHUB_WORKSPACE/.trusted-src/.yukon/setup.sh"


      - name: Sweep tunables
        shell: bash
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          export LABINIUS_SEED=$(openssl rand -hex 32)
          "$RUNNER_TEMP/labinius-trusted/labinius-fast-verify" --write-table "$T/table.bin"
          PROVER="$RUNNER_TEMP/labinius-contestant/solution/proof_generate/target/release/labinius-fast"
          run_one() {
            local reps=$1; shift
            for i in $(seq 1 "$reps"); do
              env "$@" "$PROVER" --prove "$T/proof.bin" --table "$T/table.bin" 2>&1 \
                | grep -a "labinius-profile" | tail -1
            done
          }
          echo "=== baseline (no knobs) ==="
          run_one 3 LABINIUS_X=1
          for g in 8 16 24 32; do
            echo "=== hybrid_group=$g ==="
            run_one 3 LABINIUS_HYBRID_GROUP=$g
          done
          for p in 1 2 4; do
            echo "=== fold_parts=$p ==="
            run_one 3 LABINIUS_FOLD_PARTS=$p
          done
          echo "=== hybrid_group=8 fold_parts=1 ==="
          run_one 3 LABINIUS_HYBRID_GROUP=8 LABINIUS_FOLD_PARTS=1

      - name: Benchmark
        shell: bash
        env:
          TRUSTED_CHECKOUT: ${{ github.workspace }}/.trusted-src
          UNTRUSTED_CHECKOUT: ${{ github.workspace }}/.untrusted-src
        run: |
          for i in $(seq 1 ${{ inputs.runs }}); do
            echo "=== repeat $i ==="
            bash "$GITHUB_WORKSPACE/.trusted-src/.yukon/benchmark.sh"
            cat "$GITHUB_WORKSPACE/.trusted-src/.yukon/labinius-fast-score.json"
            echo
          done

      - name: Upload score
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-score
          path: ${{ github.workspace }}/.trusted-src/.yukon/labinius-fast-score.json
          if-no-files-found: error
